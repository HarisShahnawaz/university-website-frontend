<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>My University Website</title>
  <link rel="stylesheet" href="style.css">
  <!-- Font Awesome (CDN) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
</head>
<body>
  <header class="sub-header">
    <nav>
      <a href="index.html" class="logo-link"><img src="images/logo.png" alt="logo"></a>

      <!-- toggle button (hamburger) for mobile -->
      <i class="fa-solid fa-bars menu-icon" aria-hidden="true" id="menuBtn" title="Open menu"></i>

      <div class="nav-links" id="navLinks" role="navigation" aria-label="Main Navigation">
        <i class="fa-solid fa-xmark close-icon" aria-hidden="true" id="closeBtn" title="Close menu"></i>
        <ul>
          <li><a href="/index.html">HOME</a></li>
          <li><a href="/about.html">ABOUT</a></li>
          <li><a href="/course.html">COURSE</a></li>
          <li><a href="/blog.html">BLOG</a></li>
          <li><a href="/contact.html">CONTACT</a></li>
        </ul>
      </div>
    </nav>

    <h1>Contact us</h1>
  </header>

 
  
  <!-- footer -->
  <footer class="footer">
    <h4>About Us</h4>
    <p>Our university is dedicated to providing quality education, innovation, and research opportunities that prepare students for a successful future.</p>
    <div class="icons" aria-hidden="true">
      <i class="fa-brands fa-facebook"></i>
      <i class="fa-brands fa-twitter"></i>
      <i class="fa-brands fa-linkedin"></i>
      <i class="fa-brands fa-instagram"></i>
    </div>
    <p>Made with <i class="fa-solid fa-heart"></i> by Haris coding</p>
  </footer>

  <!-- javascript for toggle menu -->
  <script>
    (function () {
      const navLinks = document.getElementById("navLinks");
      const menuBtn = document.getElementById("menuBtn");
      const closeBtn = document.getElementById("closeBtn");

      function openMenu() {
        navLinks.classList.add('active');
      }
      function closeMenu() {
        navLinks.classList.remove('active');
      }

      menuBtn.addEventListener('click', openMenu);
      closeBtn.addEventListener('click', closeMenu);

      // reset on desktop resize
      window.addEventListener('resize', function () {
        if (window.innerWidth > 768) {
          navLinks.classList.remove('active');
        }
      });
    })();
  </script>
</body>
</html>
